[tools]
node   = "26.12.1"
ruby   = "4.0.9"
java   = "latest"
python = "3.15"
rust = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
pnpm = "latest"
maven = "latest"
gradle = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "ruby", "python"]
disable_tools = ["bundler"]
# Skip releases younger than 3 days, so `mise upgrade --bump` misses freshly
# published malicious versions before they are pulled
minimum_release_age = "3d"
